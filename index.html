<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Flappy Bird (修复版)</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #70c5ce;
      overflow: hidden;
      touch-action: none; 
      font-family: 'Courier New', Courier, monospace;
    }

    canvas {
      display: block;
      margin: 0 auto;
      width: 100%;
      height: 100vh;
    }

    /* 实时分数 (游戏时显示) */
    #score {
      position: absolute;
      top: 10%;
      left: 50%;
      transform: translateX(-50%);
      font-size: 60px;
      color: white;
      font-weight: bold;
      text-shadow: 2px 2px 0 #000;
      pointer-events: none;
      z-index: 20;
    }

    /* 游戏结束/开始面板 */
    #message {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: white;
      text-shadow: 2px 2px 0 #000;
      pointer-events: none;
      z-index: 30;
      width: 80%;
    }
    
    h1 { margin: 0; font-size: 40px; color: #f1c40f; }
    p { font-size: 20px; margin: 10px 0; }

    /* 最高分显示 */
    .best-score-box {
        background: #e67e22;
        border: 2px solid white;
        padding: 10px;
        border-radius: 10px;
        margin-top: 15px;
        display: inline-block;
    }
  </style>
</head>
<body>

  <div id="score">0</div>
  
  <div id="message">
    </div>

  <canvas id="gameCanvas"></canvas>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // --- 0. 图片素材加载 (无需下载，直接引用网络资源) ---
    const sprite = new Image();
    // 使用开源的 Flappy Bird 雪碧图 (包含鸟、管子、背景)
    sprite.src = "https://raw.githubusercontent.com/samuelcust/flappy-bird-assets/master/sprites/bird.png"; // 鸟
    
    const bgImg = new Image();
    bgImg.src = "https://raw.githubusercontent.com/samuelcust/flappy-bird-assets/master/sprites/background-day.png"; // 背景

    const pipeNorthImg = new Image();
    pipeNorthImg.src = "https://raw.githubusercontent.com/samuelcust/flappy-bird-assets/master/sprites/pipe-green.png"; // 管子
    
    const fgImg = new Image();
    fgImg.src = "https://raw.githubusercontent.com/samuelcust/flappy-bird-assets/master/sprites/base.png"; // 地面

    // 确保图片加载完成后再开始绘制，防止闪烁
    let assetsLoaded = 0;
    const totalAssets = 4;
    function checkLoad() { assetsLoaded++; }
    sprite.onload = checkLoad;
    bgImg.onload = checkLoad;
    pipeNorthImg.onload = checkLoad;
    fgImg.onload = checkLoad;

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // --- 1. 全局变量 ---
    let frames = 0;
    let score = 0;
    // 🏆 读取最高分，如果没有就是0
    let bestScore = localStorage.getItem("flappyBest") || 0;
    
    const state = { current: 0, getReady: 0, game: 1, over: 2 };

    // 初始化显示
    updateMessageUI();

    // --- 2. 鸟 (Bird) ---
    const bird = {
        x: 50,
        y: 150,
        width: 34,
        height: 24,
        radius: 12,
        velocity: 0,
        gravity: 0.25,
        jump: 4.6,
        rotation: 0,
        
        draw: function() {
            // 保存画布状态
            ctx.save();
            ctx.translate(this.x, this.y);
            
            // 根据速度计算旋转角度 (让鸟头朝下或朝上)
            // 限制最大旋转角度为 90度 (Math.PI/2) 和 -25度
            if (this.velocity < 0) this.rotation = -0.4;
            else {
                this.rotation += 0.1;
                this.rotation = Math.min(Math.PI/2, this.rotation);
            }
            // 准备界面不旋转
            if (state.current == state.getReady) this.rotation = 0;

            ctx.rotate(this.rotation);
            
            // --- 🛠️ 核心修复：双重保险画鸟 ---
            // 检查1：assetsLoaded 计数器是否足够
            // 检查2：sprite.complete 属性，确认图片真的加载完了
            if(assetsLoaded >= 1 && sprite.complete) {
                // 图片加载成功，画像素鸟
                ctx.drawImage(sprite, -this.width/2, -this.height/2, this.width, this.height);
            } else {
                // 图片还没加载好，画一个黄色的球做保底（应急方案）
                ctx.fillStyle = "#ffeb3b"; // 鲜艳的黄色
                ctx.beginPath(); 
                ctx.arc(0, 0, this.radius, 0, Math.PI*2); 
                ctx.fill();
                // 画个简单的眼睛，让它看起来像只鸟
                ctx.fillStyle = "white";
                ctx.beginPath(); ctx.arc(6, -4, 4, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = "black";
                ctx.beginPath(); ctx.arc(8, -4, 1.5, 0, Math.PI*2); ctx.fill();
            }
            
            ctx.restore();
        },
        
        update: function() {
            if (state.current == state.game) {
                this.velocity += this.gravity;
                this.y += this.velocity;
                
                if (this.y + this.radius >= canvas.height - fg.h) {
                    this.y = canvas.height - fg.h - this.radius;
                    gameOver();
                }
                
                if (this.y - this.radius <= 0) {
                    this.y = this.radius;
                    this.velocity = 0;
                }
            }
            
            if (state.current == state.getReady) {
                this.y = (canvas.height / 2) - 50 + Math.cos(frames/15) * 5;
                this.rotation = 0;
            }
        },
        flap: function() { this.velocity = -this.jump; },
        reset: function() { this.velocity = 0; this.y = canvas.height / 2; this.rotation = 0; }
    }

    // --- 3. 管道 (Pipes) ---
    const pipes = {
        items: [],
        w: 52, // 管子图片原本的宽度
        h: 320, // 管子图片原本的高度
        gap: 120, // 难度间隙
        dx: 3,
        
        draw: function() {
            for(let i = 0; i < this.items.length; i++) {
                let p = this.items[i];
                
                // 下管子 (很简单，直接画)
                let bottomY = p.top + this.gap;
                // 如果图片加载了，画图；否则画绿方块
                if(assetsLoaded >= 4 && pipeNorthImg.complete) {
                     // 上管子 (需要把图片翻转！)
                    ctx.save();
                    ctx.translate(p.x, p.top); // 移动到上管子的底部
                    ctx.scale(1, -1); // 👇 垂直翻转坐标系
                    ctx.drawImage(pipeNorthImg, 0, 0, this.w, this.h); 
                    ctx.restore(); // 恢复坐标系

                    // 下管子
                    ctx.drawImage(pipeNorthImg, p.x, bottomY, this.w, this.h);
                } else {
                    ctx.fillStyle = "#2ecc71";
                    ctx.fillRect(p.x, 0, this.w, p.top);
                    ctx.fillRect(p.x, bottomY, this.w, canvas.height - bottomY);
                }
            }
        },
        
        update: function() {
            if (state.current !== state.game) return;
            
            if (frames % 120 == 0) {
                let maxTop = canvas.height - fg.h - this.gap - 50;
                let minTop = 50;
                let randomTop = Math.floor(Math.random() * (maxTop - minTop + 1) + minTop);
                this.items.push({ x: canvas.width, top: randomTop });
            }
            
            for(let i = 0; i < this.items.length; i++) {
                let p = this.items[i];
                p.x -= this.dx;
                
                let hitX = bird.x + (bird.radius-4) > p.x && bird.x - (bird.radius-4) < p.x + this.w;
                let hitY = (bird.y - (bird.radius-4) < p.top) || (bird.y + (bird.radius-4) > p.top + this.gap);
                
                if (hitX && hitY) gameOver();
                
                if (p.x + this.w < bird.x && !p.passed) {
                    score++;
                    p.passed = true;
                    document.getElementById("score").innerText = score;
                }
                
                if (p.x + this.w < 0) { this.items.shift(); i--; }
            }
        },
        reset: function() { this.items = []; }
    }

    // --- 4. 背景与地板 ---
    const bg = {
        draw: function() {
            if(assetsLoaded >= 2 && bgImg.complete) {
                // 简单的背景平铺逻辑
                ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
            } else {
                ctx.fillStyle = "#70c5ce";
                ctx.fillRect(0,0,canvas.width, canvas.height);
            }
        }
    }

    const fg = {
        h: 112,
        x: 0,
        draw: function() {
            if(assetsLoaded >= 4 && fgImg.complete) {
                // 画两张地板连接，实现无缝滚动
                // 这里的 336 是图片原本的宽度
                let w = 336; 
                // 计算需要画多少个地板才能填满屏幕
                let count = Math.ceil(canvas.width / w) + 1;
                for(let i=0; i<count; i++) {
                    ctx.drawImage(fgImg, this.x + i * w, canvas.height - this.h, w, this.h);
                }
            } else {
                ctx.fillStyle = "#ded895";
                ctx.fillRect(0, canvas.height - this.h, canvas.width, this.h);
            }
        },
        update: function() {
            if (state.current == state.game) {
                // 这里的 336 是地板素材的宽度
                this.x = (this.x - 2) % 336;
            }
        }
    }

    // --- 5. 游戏控制与UI ---
    function gameOver() {
        state.current = state.over;
        
        // 🏆 检查并保存最高分
        if(score > bestScore) {
            bestScore = score;
            localStorage.setItem("flappyBest", bestScore);
        }
        
        updateMessageUI();
    }

    function updateMessageUI() {
        const msg = document.getElementById("message");
        if (state.current == state.getReady) {
            msg.style.display = "block";
            document.getElementById("score").style.display = "none";
            msg.innerHTML = `
                <h1>FLAPPY BIRD</h1>
                <p>点击屏幕起飞</p>
                <div class="best-score-box">历史最高: ${bestScore}</div>
            `;
        } else if (state.current == state.over) {
            msg.style.display = "block";
            document.getElementById("score").style.display = "block";
            msg.innerHTML = `
                <h1 style="color: #e74c3c">GAME OVER</h1>
                <p>本局得分: ${score}</p>
                <div class="best-score-box">历史最高: ${bestScore}</div>
                <p style="font-size: 14px; margin-top: 20px; color: #eee">点击重新开始</p>
            `;
        } else {
            msg.style.display = "none";
            document.getElementById("score").style.display = "block";
        }
    }

    function clickHandler() {
        switch (state.current) {
            case state.getReady:
                state.current = state.game;
                updateMessageUI();
                break;
            case state.game:
                bird.flap();
                break;
            case state.over:
                bird.reset();
                pipes.reset();
                score = 0;
                frames = 0;
                document.getElementById("score").innerText = score;
                state.current = state.getReady;
                updateMessageUI();
                break;
        }
    }

    window.addEventListener("click", clickHandler);
    window.addEventListener("touchstart", (e) => { e.preventDefault(); clickHandler(); }, {passive: false});
    window.addEventListener("keydown", (e) => { if(e.code === "Space") clickHandler(); });

    // --- 6. 循环 ---
    function loop() {
        bird.update();
        fg.update();
        pipes.update();
        
        // 绘制顺序：背景 -> 管子 -> 地板 -> 鸟
        bg.draw();
        pipes.draw();
        fg.draw();
        bird.draw();
        
        frames++;
        requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Flappy Bird">
  <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/samuelcust/flappy-bird-assets/master/sprites/yellowbird-midflap.png">
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/samuelcust/flappy-bird-assets/master/sprites/yellowbird-midflap.png">

  <title>Flappy Bird Final</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #70c5ce;
      overflow: hidden;
      touch-action: none; 
      font-family: 'Courier New', Courier, monospace;
      overscroll-behavior: none;
      user-select: none;
      -webkit-user-select: none;
    }

    canvas {
      display: block;
      margin: 0 auto;
      width: 100%;
      height: 100vh;
    }

    #score {
      position: absolute;
      top: 10%;
      left: 50%;
      transform: translateX(-50%);
      font-size: 60px;
      color: white;
      font-weight: bold;
      text-shadow: 2px 2px 0 #000;
      pointer-events: none;
      z-index: 20;
    }

    #message {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: white;
      text-shadow: 2px 2px 0 #000;
      pointer-events: none;
      z-index: 30;
      width: 80%;
    }
    
    h1 { margin: 0; font-size: 40px; color: #f1c40f; }
    p { font-size: 20px; margin: 10px 0; }

    .best-score-box {
        background: #e67e22;
        border: 2px solid white;
        padding: 10px;
        border-radius: 10px;
        margin-top: 15px;
        display: inline-block;
    }
    
    /* 音效开关按钮 */
    #soundBtn {
        position: fixed;
        top: 40px;
        right: 20px;
        z-index: 40;
        background: rgba(0,0,0,0.5);
        color: white;
        border: 1px solid white;
        padding: 5px 10px;
        border-radius: 15px;
        font-size: 12px;
        pointer-events: auto; /* 允许点击 */
    }
  </style>
</head>
<body>

  <div id="soundBtn" onclick="toggleMute()">🔇 音效: 关</div>
  <div id="score">0</div>
  
  <div id="message">
    </div>

  <canvas id="gameCanvas"></canvas>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // --- 🔊 核心升级：音效合成器 ---
    const audio = {
        ctx: null,
        isMuted: true,
        
        init: function() {
            if (!this.ctx) {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                this.isMuted = false;
                updateSoundUI();
            } else if (this.ctx.state === 'suspended') {
                this.ctx.resume();
            }
        },
        
        play: function(type) {
            if (this.isMuted || !this.ctx) return;
            
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            
            const now = this.ctx.currentTime;
            
            if (type === 'jump') {
                // 起飞：短促的升调 (Square波形更有8-bit感)
                osc.type = 'square';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } 
            else if (type === 'score') {
                // 得分：清脆的高音叮
                osc.type = 'sine';
                osc.frequency.setValueAtTime(1000, now);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            }
            else if (type === 'hit') {
                // 撞击：低沉的锯齿波
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.linearRampToValueAtTime(50, now + 0.3);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            }
        }
    };

    function toggleMute() {
        audio.init(); // 尝试初始化
        audio.isMuted = !audio.isMuted;
        updateSoundUI();
    }
    
    function updateSoundUI() {
        const btn = document.getElementById("soundBtn");
        btn.innerText = audio.isMuted ? "🔇 音效: 关" : "🔊 音效: 开";
        btn.style.backgroundColor = audio.isMuted ? "rgba(0,0,0,0.5)" : "rgba(46, 204, 113, 0.8)";
    }

    // --- 资源加载 ---
    const bgImg = new Image();
    bgImg.src = "https://raw.githubusercontent.com/samuelcust/flappy-bird-assets/master/sprites/background-day.png";
    let bgLoaded = false;
    bgImg.onload = () => { bgLoaded = true; };

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // --- 变量 ---
    let frames = 0;
    let score = 0;
    let bestScore = localStorage.getItem("flappyBest") || 0;
    const state = { current: 0, getReady: 0, game: 1, over: 2 };

    updateMessageUI();

    // --- 鸟 ---
    const bird = {
        x: 50, y: 150, width: 34, height: 24, radius: 12,
        velocity: 0, gravity: 0.25, jump: 4.6, rotation: 0,
        
        draw: function() {
            ctx.save();
            ctx.translate(this.x, this.y);
            if (this.velocity < 0) this.rotation = -0.4;
            else {
                this.rotation += 0.1;
                this.rotation = Math.min(Math.PI/2, this.rotation);
            }
            if (state.current == state.getReady) this.rotation = 0;
            ctx.rotate(this.rotation);

            // 像素鸟绘制
            ctx.fillStyle = "#f4d03f"; ctx.fillRect(-17, -12, 34, 24);
            ctx.lineWidth = 2; ctx.strokeStyle = "#000"; ctx.strokeRect(-17, -12, 34, 24);
            ctx.fillStyle = "#fff"; ctx.fillRect(5, -10, 10, 10); ctx.strokeRect(5, -10, 10, 10);
            ctx.fillStyle = "#000"; ctx.fillRect(11, -6, 2, 2);
            ctx.fillStyle = "#e67e22"; ctx.fillRect(5, 2, 14, 8); ctx.strokeRect(5, 2, 14, 8);
            ctx.fillStyle = "#fff"; ctx.fillRect(-10, 2, 12, 6); ctx.strokeRect(-10, 2, 12, 6);
            ctx.restore();
        },
        
        update: function() {
            if (state.current == state.game) {
                this.velocity += this.gravity;
                this.y += this.velocity;
                
                if (this.y + this.radius >= canvas.height - fg.h) {
                    this.y = canvas.height - fg.h - this.radius;
                    gameOver();
                }
                if (this.y - this.radius <= 0) {
                    this.y = this.radius;
                    this.velocity = 0;
                }
            }
            if (state.current == state.getReady) {
                this.y = (canvas.height / 2) - 50 + Math.cos(frames/15) * 5;
                this.rotation = 0;
            }
        },
        flap: function() { 
            this.velocity = -this.jump; 
            audio.play('jump'); // 🔊 播放跳跃音效
        },
        reset: function() { this.velocity = 0; this.y = canvas.height / 2; this.rotation = 0; }
    }

    // --- 管道 ---
    const pipes = {
        items: [], w: 52, gap: 130, dx: 3,
        
        draw: function() {
            for(let i = 0; i < this.items.length; i++) {
                let p = this.items[i];
                let bottomY = p.top + this.gap;
                
                ctx.fillStyle = "#73bf2e"; ctx.strokeStyle = "#558c22"; ctx.lineWidth = 2;
                // 上
                ctx.fillRect(p.x, 0, this.w, p.top); ctx.strokeRect(p.x, 0, this.w, p.top);
                ctx.fillRect(p.x - 2, p.top - 20, this.w + 4, 20); ctx.strokeRect(p.x - 2, p.top - 20, this.w + 4, 20);
                // 下
                ctx.fillRect(p.x, bottomY, this.w, canvas.height - bottomY - fg.h);
                ctx.strokeRect(p.x, bottomY, this.w, canvas.height - bottomY - fg.h);
                ctx.fillRect(p.x - 2, bottomY, this.w + 4, 20); ctx.strokeRect(p.x - 2, bottomY, this.w + 4, 20);
            }
        },
        
        update: function() {
            if (state.current !== state.game) return;
            if (frames % 120 == 0) {
                let maxTop = canvas.height - fg.h - this.gap - 50;
                let minTop = 50;
                let randomTop = Math.floor(Math.random() * (maxTop - minTop + 1) + minTop);
                this.items.push({ x: canvas.width, top: randomTop });
            }
            for(let i = 0; i < this.items.length; i++) {
                let p = this.items[i];
                p.x -= this.dx;
                
                let hitX = bird.x + (bird.radius-4) > p.x && bird.x - (bird.radius-4) < p.x + this.w;
                let hitY = (bird.y - (bird.radius-4) < p.top) || (bird.y + (bird.radius-4) > p.top + this.gap);
                if (hitX && hitY) gameOver();
                
                if (p.x + this.w < bird.x && !p.passed) {
                    score++;
                    p.passed = true;
                    document.getElementById("score").innerText = score;
                    audio.play('score'); // 🔊 播放得分音效
                }
                if (p.x + this.w < 0) { this.items.shift(); i--; }
            }
        },
        reset: function() { this.items = []; }
    }

    // --- 背景/地板 ---
    const bg = {
        draw: function() {
            if(bgLoaded) ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
            else { ctx.fillStyle = "#70c5ce"; ctx.fillRect(0,0,canvas.width, canvas.height); }
        }
    }
    const fg = {
        h: 112, x: 0,
        draw: function() {
            ctx.fillStyle = "#ded895"; ctx.fillRect(0, canvas.height - this.h, canvas.width, this.h);
            ctx.fillStyle = "#73bf2e"; ctx.fillRect(0, canvas.height - this.h, canvas.width, 12); ctx.strokeRect(0, canvas.height - this.h, canvas.width, 12);
        },
        update: function() {
            if (state.current == state.game) { this.x = (this.x - 2) % 20; }
        }
    }

    // --- 控制 ---
    function gameOver() {
        state.current = state.over;
        audio.play('hit'); // 🔊 播放撞击音效
        if(score > bestScore) {
            bestScore = score;
            localStorage.setItem("flappyBest", bestScore);
        }
        updateMessageUI();
    }

    function updateMessageUI() {
        const msg = document.getElementById("message");
        if (state.current == state.getReady) {
            msg.style.display = "block";
            document.getElementById("score").style.display = "none";
            msg.innerHTML = `
                <h1>FLAPPY BIRD</h1>
                <p>点击屏幕起飞</p>
                <div class="best-score-box">历史最高: ${bestScore}</div>
            `;
        } else if (state.current == state.over) {
            msg.style.display = "block";
            document.getElementById("score").style.display = "block";
            msg.innerHTML = `
                <h1 style="color: #e74c3c">GAME OVER</h1>
                <p>本局得分: ${score}</p>
                <div class="best-score-box">历史最高: ${bestScore}</div>
                <p style="font-size: 14px; margin-top: 20px; color: #eee">点击重新开始</p>
            `;
        } else {
            msg.style.display = "none";
            document.getElementById("score").style.display = "block";
        }
    }

    function clickHandler(e) {
        // 确保音频环境初始化 (必须在用户交互中调用)
        audio.init();

        // 如果点到了音效按钮，就不触发游戏逻辑
        if (e.target.id === 'soundBtn') return;

        switch (state.current) {
            case state.getReady:
                state.current = state.game;
                // 第一次点击自动开启音效 (如果不吵的话)
                if(audio.isMuted) { audio.isMuted = false; updateSoundUI(); }
                audio.play('jump');
                updateMessageUI();
                break;
            case state.game:
                bird.flap();
                break;
            case state.over:
                bird.reset();
                pipes.reset();
                score = 0;
                frames = 0;
                document.getElementById("score").innerText = score;
                state.current = state.getReady;
                updateMessageUI();
                break;
        }
    }

    window.addEventListener("click", clickHandler);
    window.addEventListener("touchstart", (e) => { 
        if(e.target.id !== 'soundBtn') e.preventDefault(); 
        clickHandler(e); 
    }, {passive: false});
    window.addEventListener("keydown", (e) => { if(e.code === "Space") clickHandler(e); });

    function loop() {
        bird.update(); fg.update(); pipes.update();
        bg.draw(); pipes.draw(); fg.draw(); bird.draw();
        frames++;
        requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>

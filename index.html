<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <meta name="apple-mobile-web-app-capable" content="yes"> <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"> <meta name="apple-mobile-web-app-title" content="Flappy Bird"> <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/samuelcust/flappy-bird-assets/master/sprites/yellowbird-midflap.png">
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/samuelcust/flappy-bird-assets/master/sprites/yellowbird-midflap.png">

  <title>Flappy Bird PWA</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #70c5ce;
      overflow: hidden;
      touch-action: none; 
      font-family: 'Courier New', Courier, monospace;
      /* 防止 iOS 回弹效果 */
      overscroll-behavior: none;
    }

    canvas {
      display: block;
      margin: 0 auto;
      width: 100%;
      height: 100vh;
    }

    #score {
      position: absolute;
      top: 10%; /* 稍微下移一点，避开刘海屏 */
      left: 50%;
      transform: translateX(-50%);
      font-size: 60px;
      color: white;
      font-weight: bold;
      text-shadow: 2px 2px 0 #000;
      pointer-events: none;
      z-index: 20;
    }

    #message {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: white;
      text-shadow: 2px 2px 0 #000;
      pointer-events: none;
      z-index: 30;
      width: 80%;
    }
    
    h1 { margin: 0; font-size: 40px; color: #f1c40f; }
    p { font-size: 20px; margin: 10px 0; }

    .best-score-box {
        background: #e67e22;
        border: 2px solid white;
        padding: 10px;
        border-radius: 10px;
        margin-top: 15px;
        display: inline-block;
    }
  </style>
</head>
<body>

  <div id="score">0</div>
  
  <div id="message">
    </div>

  <canvas id="gameCanvas"></canvas>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // 资源加载
    const bgImg = new Image();
    bgImg.src = "https://raw.githubusercontent.com/samuelcust/flappy-bird-assets/master/sprites/background-day.png";
    let bgLoaded = false;
    bgImg.onload = () => { bgLoaded = true; };

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // 变量
    let frames = 0;
    let score = 0;
    let bestScore = localStorage.getItem("flappyBest") || 0;
    const state = { current: 0, getReady: 0, game: 1, over: 2 };

    updateMessageUI();

    // 鸟 (代码绘制)
    const bird = {
        x: 50,
        y: 150,
        width: 34,
        height: 24,
        radius: 12,
        velocity: 0,
        gravity: 0.25,
        jump: 4.6,
        rotation: 0,
        
        draw: function() {
            ctx.save();
            ctx.translate(this.x, this.y);
            if (this.velocity < 0) this.rotation = -0.4;
            else {
                this.rotation += 0.1;
                this.rotation = Math.min(Math.PI/2, this.rotation);
            }
            if (state.current == state.getReady) this.rotation = 0;
            ctx.rotate(this.rotation);

            ctx.fillStyle = "#f4d03f";
            ctx.fillRect(-17, -12, 34, 24);
            ctx.lineWidth = 2;
            ctx.strokeStyle = "#000";
            ctx.strokeRect(-17, -12, 34, 24);

            ctx.fillStyle = "#fff";
            ctx.fillRect(5, -10, 10, 10);
            ctx.strokeRect(5, -10, 10, 10);
            ctx.fillStyle = "#000";
            ctx.fillRect(11, -6, 2, 2);

            ctx.fillStyle = "#e67e22";
            ctx.fillRect(5, 2, 14, 8);
            ctx.strokeRect(5, 2, 14, 8);
            
            ctx.fillStyle = "#fff";
            ctx.fillRect(-10, 2, 12, 6);
            ctx.strokeRect(-10, 2, 12, 6);

            ctx.restore();
        },
        
        update: function() {
            if (state.current == state.game) {
                this.velocity += this.gravity;
                this.y += this.velocity;
                
                if (this.y + this.radius >= canvas.height - fg.h) {
                    this.y = canvas.height - fg.h - this.radius;
                    gameOver();
                }
                if (this.y - this.radius <= 0) {
                    this.y = this.radius;
                    this.velocity = 0;
                }
            }
            if (state.current == state.getReady) {
                this.y = (canvas.height / 2) - 50 + Math.cos(frames/15) * 5;
                this.rotation = 0;
            }
        },
        flap: function() { this.velocity = -this.jump; },
        reset: function() { this.velocity = 0; this.y = canvas.height / 2; this.rotation = 0; }
    }

    // 管道
    const pipes = {
        items: [],
        w: 52,
        gap: 130,
        dx: 3,
        
        draw: function() {
            for(let i = 0; i < this.items.length; i++) {
                let p = this.items[i];
                let bottomY = p.top + this.gap;
                
                ctx.fillStyle = "#73bf2e";
                ctx.strokeStyle = "#558c22";
                ctx.lineWidth = 2;

                ctx.fillRect(p.x, 0, this.w, p.top);
                ctx.strokeRect(p.x, 0, this.w, p.top);
                ctx.fillRect(p.x - 2, p.top - 20, this.w + 4, 20);
                ctx.strokeRect(p.x - 2, p.top - 20, this.w + 4, 20);

                ctx.fillRect(p.x, bottomY, this.w, canvas.height - bottomY - fg.h);
                ctx.strokeRect(p.x, bottomY, this.w, canvas.height - bottomY - fg.h);
                ctx.fillRect(p.x - 2, bottomY, this.w + 4, 20);
                ctx.strokeRect(p.x - 2, bottomY, this.w + 4, 20);
            }
        },
        
        update: function() {
            if (state.current !== state.game) return;
            if (frames % 120 == 0) {
                let maxTop = canvas.height - fg.h - this.gap - 50;
                let minTop = 50;
                let randomTop = Math.floor(Math.random() * (maxTop - minTop + 1) + minTop);
                this.items.push({ x: canvas.width, top: randomTop });
            }
            for(let i = 0; i < this.items.length; i++) {
                let p = this.items[i];
                p.x -= this.dx;
                
                let hitX = bird.x + (bird.radius-4) > p.x && bird.x - (bird.radius-4) < p.x + this.w;
                let hitY = (bird.y - (bird.radius-4) < p.top) || (bird.y + (bird.radius-4) > p.top + this.gap);
                if (hitX && hitY) gameOver();
                
                if (p.x + this.w < bird.x && !p.passed) {
                    score++;
                    p.passed = true;
                    document.getElementById("score").innerText = score;
                }
                if (p.x + this.w < 0) { this.items.shift(); i--; }
            }
        },
        reset: function() { this.items = []; }
    }

    // 地板与背景
    const bg = {
        draw: function() {
            if(bgLoaded) ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
            else { ctx.fillStyle = "#70c5ce"; ctx.fillRect(0,0,canvas.width, canvas.height); }
        }
    }

    const fg = {
        h: 112,
        x: 0,
        draw: function() {
            ctx.fillStyle = "#ded895";
            ctx.fillRect(0, canvas.height - this.h, canvas.width, this.h);
            ctx.fillStyle = "#73bf2e";
            ctx.fillRect(0, canvas.height - this.h, canvas.width, 12);
            ctx.strokeRect(0, canvas.height - this.h, canvas.width, 12);
        },
        update: function() {
            if (state.current == state.game) {
                this.x = (this.x - 2) % 20;
            }
        }
    }

    // 控制
    function gameOver() {
        state.current = state.over;
        if(score > bestScore) {
            bestScore = score;
            localStorage.setItem("flappyBest", bestScore);
        }
        updateMessageUI();
    }

    function updateMessageUI() {
        const msg = document.getElementById("message");
        if (state.current == state.getReady) {
            msg.style.display = "block";
            document.getElementById("score").style.display = "none";
            msg.innerHTML = `
                <h1>FLAPPY BIRD</h1>
                <p>点击屏幕起飞</p>
                <div class="best-score-box">历史最高: ${bestScore}</div>
            `;
        } else if (state.current == state.over) {
            msg.style.display = "block";
            document.getElementById("score").style.display = "block";
            msg.innerHTML = `
                <h1 style="color: #e74c3c">GAME OVER</h1>
                <p>本局得分: ${score}</p>
                <div class="best-score-box">历史最高: ${bestScore}</div>
                <p style="font-size: 14px; margin-top: 20px; color: #eee">点击重新开始</p>
            `;
        } else {
            msg.style.display = "none";
            document.getElementById("score").style.display = "block";
        }
    }

    function clickHandler() {
        switch (state.current) {
            case state.getReady:
                state.current = state.game;
                updateMessageUI();
                break;
            case state.game:
                bird.flap();
                break;
            case state.over:
                bird.reset();
                pipes.reset();
                score = 0;
                frames = 0;
                document.getElementById("score").innerText = score;
                state.current = state.getReady;
                updateMessageUI();
                break;
        }
    }

    window.addEventListener("click", clickHandler);
    window.addEventListener("touchstart", (e) => { e.preventDefault(); clickHandler(); }, {passive: false});
    window.addEventListener("keydown", (e) => { if(e.code === "Space") clickHandler(); });

    function loop() {
        bird.update();
        fg.update();
        pipes.update();
        bg.draw();
        pipes.draw();
        fg.draw();
        bird.draw();
        frames++;
        requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
